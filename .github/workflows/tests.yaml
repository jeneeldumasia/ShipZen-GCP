name: Tests

# Runs the Python test suite on every pull request and on pushes to main.
# It only reads the code: no cloud credentials, no infrastructure, no cost.
# Database tests start throwaway Postgres/Redis containers (testcontainers),
# which works because GitHub-hosted runners have Docker.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the service images
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            worker/requirements.txt
            controller/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r worker/requirements.txt \
            -r controller/requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest -q -ra --maxfail=50
