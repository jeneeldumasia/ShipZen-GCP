name: Infra Teardown

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Auto-destroy every 6 hours

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # ── Phase 1: Drain Kubernetes resources gracefully (skip if cluster gone) ─

      - name: Check if cluster exists
        id: check_cluster
        run: |
          if gcloud container clusters describe shipzen-cluster \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet 2>/dev/null; then
            echo "cluster_exists=true" >> $GITHUB_OUTPUT
          else
            echo "cluster_exists=false" >> $GITHUB_OUTPUT
            echo "Cluster not found, skipping Kubernetes teardown steps."
          fi

      - name: Configure kubectl
        if: steps.check_cluster.outputs.cluster_exists == 'true'
        run: |
          gcloud container clusters get-credentials shipzen-cluster \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Switch ArgoCD to teardown mode
        if: steps.check_cluster.outputs.cluster_exists == 'true'
        run: |
          kubectl patch application shipzen-platform -n argocd \
            --type merge \
            -p '{"spec":{"source":{"path":"infra/teardown"},"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' \
            2>/dev/null || echo "ArgoCD application not found, skipping."

          # Trigger a prune sync
          kubectl patch application shipzen-platform -n argocd \
            --type merge \
            -p '{"operation":{"sync":{"prune":true}}}' \
            2>/dev/null || true

      - name: Wait for Gateways and LoadBalancers to drain
        if: steps.check_cluster.outputs.cluster_exists == 'true'
        run: |
          echo "Waiting for LoadBalancer services and Gateways to be pruned..."
          for i in $(seq 1 60); do
            LB=$(kubectl get svc -A -o json 2>/dev/null \
              | jq '[.items[] | select(.spec.type=="LoadBalancer")] | length')
            GW=$(kubectl get gateway -A --no-headers 2>/dev/null | wc -l || echo 0)
            echo "LB services: $LB  Gateways: $GW  (attempt $i/60)"
            if [ "$LB" -eq 0 ] && [ "$GW" -eq 0 ]; then
              echo "All LB/Gateway resources drained."
              break
            fi
            sleep 10
          done

      - name: Force uninstall webhooks and Helm releases
        if: steps.check_cluster.outputs.cluster_exists == 'true'
        run: |
          # Remove Kyverno and KEDA without hooks to avoid webhook deadlocks
          helm uninstall kyverno-policies -n kyverno --no-hooks --ignore-not-found 2>/dev/null || true
          helm uninstall kyverno           -n kyverno --no-hooks --ignore-not-found 2>/dev/null || true
          helm uninstall keda              -n keda    --no-hooks --ignore-not-found 2>/dev/null || true

          # Wipe all admission webhooks — prevents stuck deletes
          kubectl delete validatingwebhookconfigurations --all --ignore-not-found 2>/dev/null || true
          kubectl delete mutatingwebhookconfigurations   --all --ignore-not-found 2>/dev/null || true

      - name: Release stuck namespace finalizers
        if: steps.check_cluster.outputs.cluster_exists == 'true'
        run: |
          for ns in $(kubectl get ns --no-headers 2>/dev/null | awk '$2=="Terminating"{print $1}'); do
            echo "Releasing finalizer on stuck namespace: $ns"
            kubectl get ns "$ns" -o json \
              | jq '.spec.finalizers=[]' \
              | kubectl replace --raw /api/v1/namespaces/"$ns"/finalize -f - || true
          done

      # ── Phase 2: Clean up GCP network artifacts not managed by Terraform ──────

      - name: Force delete GKE-owned GCP network artifacts
        # GKE creates firewall rules, forwarding rules, backend services, and
        # health checks outside of Terraform state. If these exist when Terraform
        # tries to delete the VPC it fails with "network resource already in use".
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          REGION="us-central1"

          echo "=== Deleting GKE firewall rules on shipzen-vpc ==="
          FIREWALLS=$(gcloud compute firewall-rules list \
            --filter="network~'shipzen-vpc'" \
            --format="value(name)" \
            --project="$PROJECT" 2>/dev/null || true)
          for fw in $FIREWALLS; do
            echo "  Deleting firewall: $fw"
            gcloud compute firewall-rules delete "$fw" --quiet --project="$PROJECT" || true
          done

          echo "=== Deleting k8s-* forwarding rules in $REGION ==="
          FWD_RULES=$(gcloud compute forwarding-rules list \
            --filter="name~'^k8s-'" \
            --regions="$REGION" \
            --format="value(name)" \
            --project="$PROJECT" 2>/dev/null || true)
          for fr in $FWD_RULES; do
            echo "  Deleting forwarding rule: $fr"
            gcloud compute forwarding-rules delete "$fr" \
              --region="$REGION" --quiet --project="$PROJECT" || true
          done

          echo "=== Deleting k8s-* global backend services ==="
          BACKENDS=$(gcloud compute backend-services list \
            --filter="name~'^k8s-'" \
            --format="value(name)" \
            --project="$PROJECT" 2>/dev/null || true)
          for bs in $BACKENDS; do
            echo "  Deleting backend service: $bs"
            gcloud compute backend-services delete "$bs" \
              --global --quiet --project="$PROJECT" || true
          done

          echo "=== Deleting k8s-* health checks ==="
          HCS=$(gcloud compute health-checks list \
            --filter="name~'^k8s-'" \
            --format="value(name)" \
            --project="$PROJECT" 2>/dev/null || true)
          for hc in $HCS; do
            echo "  Deleting health check: $hc"
            gcloud compute health-checks delete "$hc" \
              --global --quiet --project="$PROJECT" || true
          done

          echo "=== Deleting k8s-* target pools (legacy LB) ==="
          TPS=$(gcloud compute target-pools list \
            --filter="name~'^k8s-'" \
            --regions="$REGION" \
            --format="value(name)" \
            --project="$PROJECT" 2>/dev/null || true)
          for tp in $TPS; do
            echo "  Deleting target pool: $tp"
            gcloud compute target-pools delete "$tp" \
              --region="$REGION" --quiet --project="$PROJECT" || true
          done

          echo "Waiting 20s for GCP to process deletions..."
          sleep 20

          echo "=== Remaining artifacts (should be empty) ==="
          gcloud compute firewall-rules list \
            --filter="network~'shipzen-vpc'" \
            --format="table(name)" \
            --project="$PROJECT" 2>/dev/null || true

      # ── Phase 3: Cloudflare DNS cleanup ──────────────────────────────────────

      - name: Cleanup Cloudflare DNS
        run: |
          ZONE_NAME="jeneeldumasia.codes"
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | jq -r '.result[0].id')

          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Could not get Cloudflare zone ID, skipping DNS cleanup."
            exit 0
          fi

          echo "Cleaning up shipzen DNS records in zone $ZONE_ID..."
          PAGE=1
          while true; do
            RECORDS=$(curl -s \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?page=$PAGE&per_page=100" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

            COUNT=$(echo "$RECORDS" | jq '.result | length')
            [ "$COUNT" -eq 0 ] && break

            echo "$RECORDS" | jq -r '.result[] | select(.name | test("shipzen|jeneeldumasia")) | .id + " " + .name' \
            | while read RID RNAME; do
              echo "  Deleting DNS: $RNAME ($RID)"
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RID" \
                -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.success'
            done

            PAGE=$((PAGE + 1))
          done

      # ── Phase 4: Terraform destroy ────────────────────────────────────────────

      - name: Terraform Destroy
        working-directory: ./terraform
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: us-central1
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
          TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}
          TF_VAR_github_app_id: ${{ secrets.SHIPZEN_GITHUB_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.SHIPZEN_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}
        run: terraform destroy -auto-approve

      - name: Summary
        if: always()
        run: |
          echo "### Teardown Complete 🗑️" >> $GITHUB_STEP_SUMMARY
          echo "All ShipZen GCP infrastructure has been destroyed." >> $GITHUB_STEP_SUMMARY
