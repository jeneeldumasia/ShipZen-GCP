name: Debug Cluster
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug Cluster
        run: |
          gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}
          echo "=== NODES ==="
          kubectl get nodes -o wide || true
          echo "=== PODS ==="
          kubectl get pods -A -o wide || true
          echo "=== EVENTS ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -n 50 || true
          echo "=== WEBHOOKS ==="
          kubectl get validatingwebhookconfigurations || true
          kubectl get mutatingwebhookconfigurations || true
          
          echo "=== RESTARTING UI PODS ==="
          kubectl rollout restart deployment shipzen-ui -n shipzen-system
          
          echo "Waiting for UI pods to restart..."
          kubectl rollout status deployment shipzen-ui -n shipzen-system --timeout=60s || true
