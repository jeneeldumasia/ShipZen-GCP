name: Deploy Secrets to GKE

on:
  # Manual only: nothing runs on commits.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: WhatsApp alert destination
        # Runs before kubeconfig so it works while the cluster is down too.
        # With WHATSAPP_PHONE + WHATSAPP_APIKEY set as repository secrets, store them
        # and send a test message; otherwise just make sure an empty placeholder
        # exists (the relay then stays quiet). Never overwrites with blanks.
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          echo -n '{"phone": "", "apikey": ""}' | bash scripts/put-secret.sh shipzen-whatsapp --create-only
          if [ -n "$WHATSAPP_PHONE" ] && [ -n "$WHATSAPP_APIKEY" ]; then
            jq -cn --arg p "$WHATSAPP_PHONE" --arg k "$WHATSAPP_APIKEY" '{phone: $p, apikey: $k}' \
              | bash scripts/put-secret.sh shipzen-whatsapp
            code=$(curl -s -o /dev/null -w '%{http_code}' -G https://api.callmebot.com/whatsapp.php \
              --data-urlencode "phone=$WHATSAPP_PHONE" --data-urlencode "apikey=$WHATSAPP_APIKEY" \
              --data-urlencode "text=ShipZen alerts are connected. You'll get a message here when something breaks and when it's fixed.")
            echo "Test message sent (CallMeBot answered $code)" >> $GITHUB_STEP_SUMMARY
            [ "$code" = "200" ] || { echo "::warning title=WhatsApp test message failed::CallMeBot answered $code. Check the phone number (with country code, e.g. +91...) and the API key."; }
          else
            echo "WhatsApp not configured: add WHATSAPP_PHONE and WHATSAPP_APIKEY repository secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Update kubeconfig
        run: gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push GitHub OAuth Secret to GCP Secret Manager
        run: |
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | bash scripts/put-secret.sh shipzen-github

      - name: Push GitHub Backend App Secret to GCP Secret Manager
        run: |
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | bash scripts/put-secret.sh shipzen-github-app

      - name: Push AUTH_SECRET to GCP Secret Manager
        # AUTH_SECRET is consumed by the Next.js UI (NextAuth).
        # ESO reads it from Secrets Manager and injects it as the shipzen-auth-secret K8s secret.
        # To rotate: update the SHIPZEN_AUTH_SECRET GitHub Actions secret and re-run this workflow.
        run: |
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | bash scripts/put-secret.sh shipzen-auth-secret

      - name: Push Alerts Stub Secret to GCP Secret Manager
        # Stub secret for Alertmanager destinations to prevent ESO sync failures
        run: |
          # Create an empty placeholder only the first time. Never overwrite: once a real
          # Slack webhook / PagerDuty key is stored here, redeploys must keep it.
          echo -n '{"slack-webhook-url": "", "pagerduty-routing-key": ""}' | bash scripts/put-secret.sh shipzen-alerts --create-only
