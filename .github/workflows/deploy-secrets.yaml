name: Deploy Secrets to GKE

on:
  # Manual only: nothing runs on commits.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Telegram alerts and email notifications
        # Runs before kubeconfig so it works while the cluster is down too.
        # With TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID set as repository secrets, store
        # them for the in-cluster alert relay and send a test message; otherwise just
        # make sure an empty placeholder exists (the relay then stays quiet). Never
        # overwrites with blanks.
        # The Resend API key (RESEND_API_KEY) for deploy emails rides in the same
        # secret as "resend_api_key": a separate secret would add idle cost.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          echo -n '{"bot_token": "", "chat_id": ""}' | bash scripts/put-secret.sh shipzen-telegram --create-only
          if [ -n "$TELEGRAM_BOT_TOKEN$TELEGRAM_CHAT_ID$RESEND_API_KEY" ]; then
            jq -cn --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" --arg r "$RESEND_API_KEY" \
              '{bot_token: $t, chat_id: $c, resend_api_key: $r}' \
              | bash scripts/put-secret.sh shipzen-telegram
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            bash scripts/notify.sh "ShipZen alerts are connected. You'll get a message here when something breaks and when it's fixed." \
              | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "Telegram not configured: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            echo "Deploy emails: Resend key stored (run Set Up Email once for the DNS records)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Deploy emails off: add a RESEND_API_KEY repository secret." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Update kubeconfig
        run: gcloud container clusters get-credentials shipzen-cluster --zone us-central1-c --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push GitHub OAuth Secret to GCP Secret Manager
        run: |
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | bash scripts/put-secret.sh shipzen-github

      - name: Push GitHub Backend App Secret to GCP Secret Manager
        run: |
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | bash scripts/put-secret.sh shipzen-github-app

      - name: Push the data encryption key to GCP Secret Manager
        # SHIPZEN_DATA_KEY encrypts secrets stored in Postgres (api/crypto_box.py).
        # Create-only: changing it later would make stored values unreadable.
        env:
          DATA_KEY: ${{ secrets.SHIPZEN_DATA_KEY }}
        run: |
          if [ -n "$DATA_KEY" ]; then
            printf '{"key": "%s"}' "$DATA_KEY" | bash scripts/put-secret.sh shipzen-data-key --create-only
          else
            echo "SHIPZEN_DATA_KEY not set; secrets in Postgres stay unencrypted."
          fi

      - name: Push AUTH_SECRET to GCP Secret Manager
        # AUTH_SECRET is consumed by the Next.js UI (NextAuth).
        # ESO reads it from Secrets Manager and injects it as the shipzen-auth-secret K8s secret.
        # To rotate: update the SHIPZEN_AUTH_SECRET GitHub Actions secret and re-run this workflow.
        run: |
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | bash scripts/put-secret.sh shipzen-auth-secret

      - name: Push Alerts Stub Secret to GCP Secret Manager
        # Stub secret for Alertmanager destinations to prevent ESO sync failures
        run: |
          # Create an empty placeholder only the first time. Never overwrite: once a real
          # Slack webhook / PagerDuty key is stored here, redeploys must keep it.
          echo -n '{"slack-webhook-url": "", "pagerduty-routing-key": ""}' | bash scripts/put-secret.sh shipzen-alerts --create-only
