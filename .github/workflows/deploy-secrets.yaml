name: Deploy Secrets to GKE

on:
  # Only trigger on changes to this workflow file itself, or manually.
  # Pushing secrets on every commit to main is unnecessary overhead.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-secrets.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: WhatsApp alert destination
        # Runs before kubeconfig so it works while the cluster is down too.
        # With WHATSAPP_PHONE + WHATSAPP_APIKEY set as repository secrets, store them
        # and send a test message; otherwise just make sure an empty placeholder
        # exists (the relay then stays quiet). Never overwrites with blanks.
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          gcloud secrets describe shipzen-whatsapp >/dev/null 2>&1 || {
            gcloud secrets create shipzen-whatsapp --replication-policy="automatic"
            echo -n '{"phone": "", "apikey": ""}' | gcloud secrets versions add shipzen-whatsapp --data-file=-
          }
          if [ -n "$WHATSAPP_PHONE" ] && [ -n "$WHATSAPP_APIKEY" ]; then
            jq -cn --arg p "$WHATSAPP_PHONE" --arg k "$WHATSAPP_APIKEY" '{phone: $p, apikey: $k}' \
              | gcloud secrets versions add shipzen-whatsapp --data-file=-
            code=$(curl -s -o /dev/null -w '%{http_code}' -G https://api.callmebot.com/whatsapp.php \
              --data-urlencode "phone=$WHATSAPP_PHONE" --data-urlencode "apikey=$WHATSAPP_APIKEY" \
              --data-urlencode "text=ShipZen alerts are connected. You'll get a message here when something breaks and when it's fixed.")
            echo "Test message sent (CallMeBot answered $code)" >> $GITHUB_STEP_SUMMARY
            [ "$code" = "200" ] || { echo "::warning title=WhatsApp test message failed::CallMeBot answered $code. Check the phone number (with country code, e.g. +91...) and the API key."; }
          else
            echo "WhatsApp not configured: add WHATSAPP_PHONE and WHATSAPP_APIKEY repository secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Update kubeconfig
        run: gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push GitHub OAuth Secret to GCP Secret Manager
        run: |
          gcloud secrets create shipzen-github --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_OAUTH_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | gcloud secrets versions add shipzen-github --data-file=-

      - name: Push GitHub Backend App Secret to GCP Secret Manager
        run: |
          gcloud secrets create shipzen-github-app --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | gcloud secrets versions add shipzen-github-app --data-file=-

      - name: Push AUTH_SECRET to GCP Secret Manager
        # AUTH_SECRET is consumed by the Next.js UI (NextAuth).
        # ESO reads it from Secrets Manager and injects it as the shipzen-auth-secret K8s secret.
        # To rotate: update the SHIPZEN_AUTH_SECRET GitHub Actions secret and re-run this workflow.
        run: |
          gcloud secrets create shipzen-auth-secret --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | gcloud secrets versions add shipzen-auth-secret --data-file=-

      - name: Push Alerts Stub Secret to GCP Secret Manager
        # Stub secret for Alertmanager destinations to prevent ESO sync failures
        run: |
          # Create an empty placeholder only the first time. Never overwrite: once a real
          # Slack webhook / PagerDuty key is stored here, redeploys must keep it.
          if ! gcloud secrets describe shipzen-alerts >/dev/null 2>&1; then
            gcloud secrets create shipzen-alerts --replication-policy="automatic"
            echo -n '{"slack-webhook-url": "", "pagerduty-routing-key": ""}' | gcloud secrets versions add shipzen-alerts --data-file=-
          fi
