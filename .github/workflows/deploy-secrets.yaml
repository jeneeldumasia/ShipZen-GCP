name: Deploy Secrets to EKS

on:
  # Only trigger on changes to this workflow file itself, or manually.
  # Pushing secrets on every commit to main is unnecessary overhead.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-secrets.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Update kubeconfig
        run: gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push GitHub OAuth Secret to GCP Secret Manager
        run: |
          gcloud secrets create shipzen-github --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | gcloud secrets versions add shipzen-github --data-file=-

      - name: Push GitHub Backend App Secret to GCP Secret Manager
        run: |
          gcloud secrets create shipzen-github-app --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | gcloud secrets versions add shipzen-github-app --data-file=-

      - name: Push AUTH_SECRET to GCP Secret Manager
        # AUTH_SECRET is consumed by the Next.js UI (NextAuth).
        # ESO reads it from Secrets Manager and injects it as the shipzen-auth-secret K8s secret.
        # To rotate: update the SHIPZEN_AUTH_SECRET GitHub Actions secret and re-run this workflow.
        run: |
          gcloud secrets create shipzen-auth-secret --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | gcloud secrets versions add shipzen-auth-secret --data-file=-

      - name: Push Alerts Stub Secret to GCP Secret Manager
        # Stub secret for Alertmanager destinations to prevent ESO sync failures
        run: |
          gcloud secrets create shipzen-alerts --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"slack-webhook-url\": \"\", \"pagerduty-routing-key\": \"\"}" | gcloud secrets versions add shipzen-alerts --data-file=-
