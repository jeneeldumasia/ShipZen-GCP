name: Deploy Secrets to EKS

on:
  # Only trigger on changes to this workflow file itself, or manually.
  # Pushing secrets on every commit to main is unnecessary overhead.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-secrets.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Update kubeconfig
        run: gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push GitHub OAuth Secret to AWS Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "shipzen/github" \
            --secret-string "{\"client_id\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} 2>/dev/null || \
          aws secretsmanager create-secret \
            --name "shipzen/github" \
            --description "GitHub OAuth secrets" \
            --secret-string "{\"client_id\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Push GitHub Backend App Secret to AWS Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "shipzen/github-app" \
            --secret-string "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} 2>/dev/null || \
          aws secretsmanager create-secret \
            --name "shipzen/github-app" \
            --description "GitHub App private key" \
            --secret-string "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Push AUTH_SECRET to AWS Secrets Manager
        # AUTH_SECRET is consumed by the Next.js UI (NextAuth).
        # ESO reads it from Secrets Manager and injects it as the shipzen-auth-secret K8s secret.
        # To rotate: update the SHIPZEN_AUTH_SECRET GitHub Actions secret and re-run this workflow.
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "shipzen/auth-secret" \
            --secret-string "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} 2>/dev/null || \
          aws secretsmanager create-secret \
            --name "shipzen/auth-secret" \
            --description "NextAuth AUTH_SECRET for ShipZen UI" \
            --secret-string "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Push Alerts Stub Secret to AWS Secrets Manager
        # Stub secret for Alertmanager destinations to prevent ESO sync failures
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "shipzen/alerts" \
            --secret-string "{\"slack-webhook-url\": \"\", \"pagerduty-routing-key\": \"\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }} 2>/dev/null || \
          aws secretsmanager create-secret \
            --name "shipzen/alerts" \
            --description "Alertmanager destination secrets" \
            --secret-string "{\"slack-webhook-url\": \"\", \"pagerduty-routing-key\": \"\"}" \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}
