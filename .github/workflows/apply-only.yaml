name: Apply Infrastructure Changes

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: us-central1
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
          TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}
          TF_VAR_github_app_id: ${{ secrets.SHIPZEN_GITHUB_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.SHIPZEN_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: us-central1
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
          TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}
          TF_VAR_github_app_id: ${{ secrets.SHIPZEN_GITHUB_APP_ID }}
          TF_VAR_github_app_installation_id: ${{ secrets.SHIPZEN_APP_INSTALLATION_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials shipzen-cluster \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Push Secrets to GCP Secret Manager
        run: |
          echo "Ensuring secrets exist in GCP Secret Manager..."
          
          gcloud secrets create shipzen-github --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | \
            gcloud secrets versions add shipzen-github --data-file=-

          gcloud secrets create shipzen-github-app --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | \
            gcloud secrets versions add shipzen-github-app --data-file=-

          gcloud secrets create shipzen-auth-secret --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | \
            gcloud secrets versions add shipzen-auth-secret --data-file=-

          gcloud secrets create shipzen-alerts --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"slack-webhook-url\": \"\", \"pagerduty-routing-key\": \"\"}" | \
            gcloud secrets versions add shipzen-alerts --data-file=-

      - name: Trigger ArgoCD Sync
        run: |
          kubectl patch application shipzen-platform -n argocd \
            -p '{"operation":{"sync":{"revision":"HEAD"}}}' --type=merge || true

      - name: Wait for ArgoCD Sync
        run: |
          echo "Waiting for ArgoCD to sync..."
          for i in {1..30}; do
            STATUS=$(kubectl get application shipzen-platform -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH=$(kubectl get application shipzen-platform -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            echo "Sync: $STATUS, Health: $HEALTH"
            
            if [ "$STATUS" == "Synced" ] && [ "$HEALTH" == "Healthy" ]; then
              echo "✅ ArgoCD sync completed successfully!"
              break
            fi
            
            if [ $i -eq 30 ]; then
              echo "⚠️ ArgoCD sync taking longer than expected, but continuing..."
              kubectl describe application shipzen-platform -n argocd || true
            fi
            
            sleep 10
          done

      - name: Wait for Load Balancer
        run: |
          echo "Waiting for Load Balancer to be provisioned..."
          ELAPSED=0
          MAX_WAIT=300
          NLB_URL=""
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            NLB_URL=$(kubectl get svc -A -o jsonpath="{.items[?(@.spec.type=='LoadBalancer')].status.loadBalancer.ingress[0].ip}" 2>/dev/null | awk '{print $1}')
            
            if [ -n "$NLB_URL" ]; then
              echo "✅ Load Balancer is ready: $NLB_URL"
              break
            fi
            
            if [ $ELAPSED -eq 0 ]; then
              echo "Checking if LoadBalancer service exists..."
              kubectl get gateway -A || true
            fi
            
            echo "Load Balancer not ready yet (${ELAPSED}s/${MAX_WAIT}s)..."
            sleep 10
            ELAPSED=$((ELAPSED+10))
          done
          
          if [ -z "$NLB_URL" ]; then
            echo "⚠️ Load Balancer not ready yet, but deployment may still succeed"
            echo "Check manually: kubectl get svc -A | grep LoadBalancer"
            kubectl get application shipzen-platform -n argocd || true
            kubectl get gateway -A -o yaml || true
          else
            echo "NLB_URL=$NLB_URL" >> $GITHUB_ENV
          fi

      - name: Update Cloudflare DNS (if LoadBalancer ready)
        if: env.NLB_URL != ''
        run: |
          echo "Updating Cloudflare DNS..."
          ZONE_NAME="jeneeldumasia.codes"
          RECORDS=("*" "shipzen")
          
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" \
               -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
               -H "Content-Type: application/json" | jq -r '.result[0].id')
               
          for RECORD_NAME in "${RECORDS[@]}"; do
            if [ "$RECORD_NAME" == "*" ]; then
              FULL_RECORD_NAME="*.jeneeldumasia.codes"
            else
              FULL_RECORD_NAME="shipzen.jeneeldumasia.codes"
            fi
            
            RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$FULL_RECORD_NAME&type=CNAME" \
                 -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                 -H "Content-Type: application/json" | jq -r '.result[0].id')

            if [ -z "$RECORD_ID" ] || [ "$RECORD_ID" == "null" ]; then
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                   -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                   -H "Content-Type: application/json" \
                   --data '{"type":"CNAME","name":"'"$RECORD_NAME"'","content":"'${{ env.NLB_URL }}'","ttl":1,"proxied":true}'
            else
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                   -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                   -H "Content-Type: application/json" \
                   --data '{"type":"CNAME","name":"'"$RECORD_NAME"'","content":"'${{ env.NLB_URL }}'","ttl":1,"proxied":true}'
            fi
          done

      - name: Summary
        run: |
          echo "### Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** shipzen-cluster (us-central1)" >> $GITHUB_STEP_SUMMARY
          echo "**ArgoCD:** Check sync status with \`kubectl get application shipzen-platform -n argocd\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.NLB_URL }}" ]; then
            echo "**Load Balancer:** ${{ env.NLB_URL }}" >> $GITHUB_STEP_SUMMARY
            echo "**DNS:** shipzen.jeneeldumasia.codes" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Load Balancer:** Still provisioning, check with \`kubectl get svc -A\`" >> $GITHUB_STEP_SUMMARY
          fi
