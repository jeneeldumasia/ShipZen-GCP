name: Deploy Platform Infra

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init



      - name: Cleanup Stuck Webhooks
        working-directory: ./terraform
        run: |
          gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }} || true
          # Only delete specific webhooks known to cause stuck ArgoCD syncs.
          # Do NOT use --all: that would delete Kyverno and cert-manager webhooks too.
          # shipzen-platform-webhook: ArgoCD application webhook that sometimes sticks post-deploy.
          kubectl delete validatingwebhookconfigurations shipzen-platform-webhook --ignore-not-found || true
          # Add further names here with an inline comment explaining why each is targeted.



      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: us-central1
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
          TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}
        run: terraform plan -out=tfplan

      - name: Configure kubectl
        run: gcloud container clusters get-credentials shipzen-cluster --region us-central1 --project ${{ secrets.GCP_PROJECT_ID }}
        continue-on-error: true

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_gcp_project: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: us-central1
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_pg_password: ${{ secrets.PG_PASSWORD }}
          TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          if ! terraform apply -auto-approve tfplan; then
            echo "::error::Terraform Apply failed! Dumping observability cluster state for debugging..."
            kubectl get pods -n observability || true
            kubectl describe pods -n observability || true
            kubectl get events -n observability || true
            exit 1
          fi

      - name: Push Secrets to GCP Secret Manager
        run: |
          echo "Pushing GitHub OAuth Secret..."
          gcloud secrets create shipzen-github --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"client_id\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.SHIPZEN_GITHUB_CLIENT_SECRET }}\", \"app_webhook_secret\": \"${{ secrets.SHIPZEN_GITHUB_APP_WEBHOOK_SECRET }}\"}" | gcloud secrets versions add shipzen-github --data-file=-

          echo "Pushing GitHub Backend App Secret..."
          gcloud secrets create shipzen-github-app --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"app_id\": \"${{ secrets.SHIPZEN_GITHUB_APP_ID }}\", \"private_key\": \"${{ secrets.SHIPZEN_GITHUB_APP_PRIVATE_KEY }}\"}" | gcloud secrets versions add shipzen-github-app --data-file=-

          echo "Pushing AUTH_SECRET..."
          gcloud secrets create shipzen-auth-secret --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"value\": \"${{ secrets.SHIPZEN_AUTH_SECRET }}\"}" | gcloud secrets versions add shipzen-auth-secret --data-file=-

          echo "Pushing Alerts Stub Secret..."
          gcloud secrets create shipzen-alerts --replication-policy="automatic" 2>/dev/null || true
          echo -n "{\"slack-webhook-url\": \"\", \"pagerduty-routing-key\": \"\"}" | gcloud secrets versions add shipzen-alerts --data-file=-

          echo "Triggering ArgoCD sync..."
          kubectl patch application shipzen-platform -n argocd -p '{"operation":{"sync":{"revision":"HEAD"}}}' --type=merge 2>/dev/null || true
          sleep 10


      - name: Wait for Load Balancer
        run: |
          echo "Waiting for Load Balancer to be provisioned by GCP..."
          ELAPSED=0
          MAX_WAIT=600
          NLB_URL=""
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Scan all namespaces for the LoadBalancer service. GCP LB uses .ip instead of .hostname
            NLB_URL=$(kubectl get svc -A -o jsonpath="{.items[?(@.spec.type=='LoadBalancer')].status.loadBalancer.ingress[0].ip}" 2>/dev/null | awk '{print $1}')
            if [ -n "$NLB_URL" ]; then
              echo "Load Balancer is ready: $NLB_URL"
              break
            fi
            echo "Load Balancer not ready yet (${ELAPSED}s/${MAX_WAIT}s)..."
            sleep 10
            ELAPSED=$((ELAPSED+10))
          done
          if [ -z "$NLB_URL" ]; then
            echo "Error: Load Balancer was not provisioned in time. Dumping cluster state for debugging..."
            kubectl get svc -A || true
            kubectl get gatewayclass -A || true
            kubectl get gateway -A -o yaml || true
            kubectl get externalsecret -A -o yaml || true
            kubectl get secret shipzen-tls-cert -n shipzen-system || true
            echo "--- DESCRIBING ARGOCD APP TO FIND SYNC ERRORS ---"
            kubectl describe application shipzen-platform -n argocd || true
            echo "--- DRY RUNNING KUSTOMIZE TO FIND VALIDATION ERRORS ---"
            kubectl apply -k infra/system --dry-run=server || true
            kubectl get events -A --sort-by='.lastTimestamp' | tail -n 50 || true
            exit 1
          fi
          echo "NLB_URL=$NLB_URL" >> $GITHUB_ENV

      - name: Automate Cloudflare CNAME
        run: |
          echo "Updating Cloudflare DNS..."
          ZONE_NAME="jeneeldumasia.codes"
          RECORDS=("*" "shipzen")
          
          # Get Zone ID
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" \
               -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
               -H "Content-Type: application/json" | jq -r '.result[0].id')
               
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" == "null" ]; then
            echo "Error: Could not retrieve Zone ID for $ZONE_NAME. Please check your Cloudflare API token permissions."
            exit 1
          fi

          for RECORD_NAME in "${RECORDS[@]}"; do
            if [ "$RECORD_NAME" == "*" ]; then
              FULL_RECORD_NAME="*.jeneeldumasia.codes"
            else
              FULL_RECORD_NAME="shipzen.jeneeldumasia.codes"
            fi
            
            echo "Processing record: $FULL_RECORD_NAME"
            
            # Check if record exists
            RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$FULL_RECORD_NAME&type=CNAME" \
                 -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                 -H "Content-Type: application/json" | jq -r '.result[0].id')

            if [ -z "$RECORD_ID" ] || [ "$RECORD_ID" == "null" ]; then
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                   -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                   -H "Content-Type: application/json" \
                   --data '{"type":"CNAME","name":"'"$RECORD_NAME"'","content":"'${{ env.NLB_URL }}'","ttl":1,"proxied":true}'
              echo "Created new CNAME record $RECORD_NAME."
            else
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                   -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                   -H "Content-Type: application/json" \
                   --data '{"type":"CNAME","name":"'"$RECORD_NAME"'","content":"'${{ env.NLB_URL }}'","ttl":1,"proxied":true}'
              echo "Updated existing CNAME record $RECORD_NAME."
            fi
          done

          echo "### Deployment Fully Automated :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Network Load Balancer:** \`${{ env.NLB_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo ":white_check_mark: **DNS Record:** Automated via Cloudflare API" >> $GITHUB_STEP_SUMMARY
          echo ":white_check_mark: **TLS Certificate:** Cloudflare Origin CA synced via ESO" >> $GITHUB_STEP_SUMMARY

# Force trigger pipeline
