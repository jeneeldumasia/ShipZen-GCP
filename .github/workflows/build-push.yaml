name: Build and Push Docker Images
on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'ui/**'
      - 'controller/**'
      - 'worker/**'
      - '.github/workflows/build-push.yaml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        component: [api, ui, controller, worker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        env:
          GAR_REGISTRY: "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}"
        run: |
          IMAGE=$GAR_REGISTRY/shipzen-platform/${{ matrix.component }}
          TAG=$(git rev-parse --short HEAD)
          docker build \
            -t $IMAGE:sha-$TAG \
            -t $IMAGE:latest \
            ./${{ matrix.component }}
          docker push $IMAGE:sha-$TAG
          docker push $IMAGE:latest

  update-kustomization:
    # Single job — runs after ALL matrix builds succeed.
    # Updating kustomization.yaml in one atomic commit avoids the race condition
    # where parallel matrix jobs clobber each other's tag updates.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the very latest commit so we rebase on top of it
          ref: main
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Update all component tags in kustomization.yaml
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          echo "Updating all built components to tag: $TAG"

          python3 - <<'PYEOF'
          import re, os

          tag = os.environ["TAG"]
          registry = os.environ["GAR_REGISTRY"]
          path = "infra/kustomization.yaml"

          with open(path, "r") as f:
              content = f.read()

          # Update newName for all components (including builder) to avoid hardcoding Account ID
          for c in ["api", "ui", "controller", "worker", "builder"]:
              content = re.sub(
                  rf'(name: shipzen-{c}\n\s+newName:) [^\n]+',
                  rf'\1 {registry}/shipzen-platform/{c}',
                  content
              )

          # Update newTag ONLY for the components built in this workflow
          for c in ["api", "ui", "controller", "worker"]:
              content = re.sub(
                  rf'(name: shipzen-{c}\n\s+newName:[^\n]+\n\s+newTag:) [^\n]+',
                  rf'\1 {tag}',
                  content
              )

          # Collapse any run of >2 consecutive blank lines to 1 blank line
          content = re.sub(r'\n{3,}', '\n\n', content)

          with open(path, "w") as f:
              f.write(content)
          PYEOF
        env:
          TAG: sha-$(echo "${{ github.sha }}" | cut -c1-7)
          GAR_REGISTRY: "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}"

      - name: Commit and push tag update
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add infra/kustomization.yaml

          if git diff-index --quiet HEAD; then
            echo "No tag changes to commit."
            exit 0
          fi

          git commit -m "chore: update platform images to ${TAG} [skip ci]"

          # Retry loop handles any last-second push from another workflow
          for i in {1..5}; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Successfully pushed kustomization update"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: failed to push after 5 attempts"
          exit 1
