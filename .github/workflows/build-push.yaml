name: Build and Push Docker Images
on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'ui/**'
      - 'controller/**'
      - 'worker/**'
      - '.github/workflows/build-push.yaml'
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      # Let every component finish so one failure doesn't hide the others' status.
      fail-fast: false
      matrix:
        component: [api, ui, controller, worker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        env:
          GAR_REGISTRY: "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}"
        run: |
          IMAGE=$GAR_REGISTRY/shipzen-platform/${{ matrix.component }}
          TAG=$(git rev-parse --short HEAD)
          cp -r shipzen_common ./${{ matrix.component }}/shipzen_common || true
          bash scripts/ci-run.sh "docker build ${{ matrix.component }}" docker build \
            -t $IMAGE:sha-$TAG \
            -t $IMAGE:latest \
            ./${{ matrix.component }}
          bash scripts/ci-run.sh "docker push ${{ matrix.component }}" docker push $IMAGE:sha-$TAG
          bash scripts/ci-run.sh "docker push ${{ matrix.component }}:latest" docker push $IMAGE:latest

  update-kustomization:
    # Single job — runs after ALL matrix builds succeed.
    # Updating kustomization.yaml in one atomic commit avoids the race condition
    # where parallel matrix jobs clobber each other's tag updates.
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the very latest commit so we rebase on top of it
          ref: main
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Update all component tags in kustomization.yaml
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          echo "Updating all built components to tag: $TAG"

          python3 - <<'PYEOF'
          import re, os

          tag = os.environ["TAG"]
          registry = os.environ["GAR_REGISTRY"]
          path = "infra/kustomization.yaml"

          with open(path, "r") as f:
              content = f.read()

          # newName is now managed via ArgoCD kustomize.images overlay.

          # Update newTag ONLY for the components built in this workflow
          for c in ["api", "ui", "controller", "worker"]:
              content = re.sub(
                  rf'(name: shipzen-{c}\n\s+newTag:) [^\n]+',
                  rf'\1 {tag}',
                  content
              )

          # Collapse any run of >2 consecutive blank lines to 1 blank line
          content = re.sub(r'\n{3,}', '\n\n', content)

          with open(path, "w") as f:
              f.write(content)
          PYEOF
        env:
          TAG: sha-$(echo "${{ github.sha }}" | cut -c1-7)
          GAR_REGISTRY: "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}"

      - name: Commit and push tag update
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add infra/kustomization.yaml

          if git diff-index --quiet HEAD; then
            echo "No tag changes to commit."
            exit 0
          fi

          git commit -m "chore: update platform images to ${TAG} [skip ci]"

          # Retry loop handles any last-second push from another workflow
          for i in {1..5}; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Successfully pushed kustomization update"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: failed to push after 5 attempts"
          exit 1

      - name: Install kubectl auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Roll the platform to the new images
        # The ArgoCD Application overrides image names (to add the registry path)
        # and that override drops the newTag from infra/kustomization.yaml, so the
        # pods kept running ':latest' and never rolled when a new image was built.
        # Pin the exact tag in the Application's override instead; ArgoCD then
        # syncs a changed pod spec and rolls the Deployments.
        env:
          GAR_REGISTRY: "us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}"
        run: |
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          if ! gcloud container clusters get-credentials shipzen-cluster --region us-central1 \
               --project ${{ secrets.GCP_PROJECT_ID }} 2>/dev/null; then
            echo "Cluster not running; skipping rollout (the next apply deploys :latest)."
            exit 0
          fi
          if ! kubectl get application shipzen-platform -n argocd >/dev/null 2>&1; then
            echo "ArgoCD Application not found; skipping rollout."
            exit 0
          fi
          IMAGES=""
          for c in api controller worker ui; do   # only images this workflow builds
            IMAGES="$IMAGES\"shipzen-$c=$GAR_REGISTRY/shipzen-platform/$c:$TAG\","
          done
          kubectl patch application shipzen-platform -n argocd --type merge \
            -p "{\"spec\":{\"source\":{\"kustomize\":{\"images\":[${IMAGES%,}]}}}}"
          kubectl annotate application shipzen-platform -n argocd argocd.argoproj.io/refresh=hard --overwrite
          echo "Pinned platform images to $TAG"

          # A merge that changes manifests AND code is synced by ArgoCD as soon as
          # it lands, minutes before the new images exist. If those manifests need
          # the new code (e.g. a new health-check port), that sync fails and keeps
          # retrying with the old images, blocking the sync that would bring in the
          # new ones. Cancel such a stuck operation and start a fresh sync.
          op_phase() { kubectl get application shipzen-platform -n argocd -o jsonpath='{.status.operationState.phase}'; }
          op_msg()   { kubectl get application shipzen-platform -n argocd -o jsonpath='{.status.operationState.message}'; }
          unstick() {
            if [ "$(op_phase)" = "Running" ] && op_msg | grep -qi "retrying"; then
              echo "Cancelling stuck sync: $(op_msg)"
              kubectl patch application shipzen-platform -n argocd --type merge \
                -p '{"status":{"operationState":{"phase":"Terminating"}}}'
              for i in $(seq 1 30); do
                case "$(op_phase)" in Running|Terminating) sleep 5 ;; *) break ;; esac
              done
              kubectl patch application shipzen-platform -n argocd --type merge \
                -p '{"operation":{"initiatedBy":{"username":"build-push"},"sync":{"revision":"HEAD","prune":true}}}'
              echo "Started a fresh sync with $TAG"
            fi
          }
          unstick
          for d in shipzen-api shipzen-worker shipzen-controller shipzen-ui; do
            for i in $(seq 1 30); do
              img=$(kubectl get deploy $d -n shipzen-system -o jsonpath='{.spec.template.spec.containers[0].image}')
              case "$img" in *":$TAG") break ;; esac
              unstick
              sleep 10
            done
            kubectl rollout status deploy/$d -n shipzen-system --timeout=600s
          done
