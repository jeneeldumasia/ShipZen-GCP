# Where the API may connect to (enforced by GKE Dataplane V2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-egress
  namespace: shipzen-system
spec:
  podSelector:
    matchLabels:
      app: shipzen-api
  policyTypes:
    - Egress
  egress:
    - ports:   # DNS
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:      # Cloud SQL (private IP in the VPC's private services range)
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
          protocol: TCP
    - to:      # Redis
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:      # GKE metadata server: Workload Identity tokens for Secret Manager / GCS
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - port: 988
          protocol: TCP
    - ports:   # HTTPS anywhere: GitHub, Google APIs, the Kubernetes API (private endpoint)
        - port: 443
          protocol: TCP
