apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shipzen-api-redeployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # Read-only access for the admin dashboard (/admin/metrics): node count and
  # CPU, and the ArgoCD sync state. Without these the dashboard showed zeros
  # and a hard-coded "Synced".
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shipzen-api-redeployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shipzen-api-redeployer
subjects:
  - kind: ServiceAccount
    name: shipzen-api-sa
    namespace: shipzen-system
