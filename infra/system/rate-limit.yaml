apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: global-rate-limit
  namespace: shipzen-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shipzen-gateway
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 100
            unit: Minute
          clientSelectors:
            - type: SourceIP
