apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shipzen-api-pdb
  namespace: shipzen-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shipzen-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shipzen-worker-pdb
  namespace: shipzen-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shipzen-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shipzen-controller-pdb
  namespace: shipzen-system
spec:
  # Controller uses leader election — only 1 pod is active, but we still want
  # at least 1 available so standby can take over during node drain.
  minAvailable: 1
  selector:
    matchLabels:
      app: shipzen-controller
