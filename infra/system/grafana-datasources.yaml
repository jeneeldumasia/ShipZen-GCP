# Extra Grafana datasources, picked up by the Grafana datasource sidecar
# (kube-prometheus-stack watches ConfigMaps labelled grafana_datasource=1 in
# the observability namespace). Prometheus is provisioned by the chart itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |-
    apiVersion: 1
    datasources:
      - name: Logs
        type: loki
        uid: loki
        access: proxy
        url: http://loki-stack.shipzen-system.svc:3100
        isDefault: false
        jsonData:
          maxLines: 1000
