apiVersion: v1
kind: Namespace
metadata:
  name: shipzen-build
  labels:
    shipzen.jeneeldumasia.codes/system: "true"
    # Build pods require elevated permissions:
    # - buildkit rootless needs seccompProfile=Unconfined + apparmor unconfined
    # - BuildpackBuilder pack/dind needs privileged=true
    # "privileged" PSS level allows all of the above.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
# Caps what builds can use at once (security finding H7): each build asks for
# about 1-1.5 CPU and 3 GiB, so this allows ~4 concurrent builds and keeps a
# burst of (possibly abusive) builds from starving everything else.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: build-quota
  namespace: shipzen-build
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "10"
    limits.memory: 20Gi
    pods: "8"
