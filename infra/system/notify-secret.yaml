# Email notifications (shipzen_common/notify.py): the Resend API key for the
# worker and controller. Stored as the "resend_api_key" field of the existing
# Secret Manager secret "shipzen-telegram" (both are notification credentials):
# a separate secret would add idle cost (only 6 secret versions are free).
# Extracting the whole JSON means a missing field just leaves the key absent
# (no email), instead of failing the sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shipzen-notify
  namespace: shipzen-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: shipzen-notify
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shipzen-telegram
