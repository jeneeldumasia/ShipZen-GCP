# Who may open connections to the ShipZen platform pods (enforced by GKE
# Dataplane V2). Tenant apps and build Jobs are deliberately absent: untrusted
# code must not reach the API, Redis or anything else in shipzen-system except
# through the public gateway like any visitor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: shipzen-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:   # platform components talking to each other (API ↔ Redis, etc.)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shipzen-system
    - from:   # the public gateway (UI, API routes)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    - from:   # Prometheus scraping, Grafana reading Loki, Alertmanager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
