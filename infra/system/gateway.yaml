apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gcp-nlb-proxy
  namespace: shipzen-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          networking.gke.io/load-balancer-type: "External"
        # Only accept traffic from Cloudflare. Every public hostname is proxied
        # through Cloudflare (ExternalDNS --cloudflare-proxied); without this the
        # load balancer IP could be hit directly with a Host header, bypassing
        # Cloudflare's DDoS protection, WAF and bot filtering. GKE turns this
        # into a VPC firewall rule; its own health-check ranges are unaffected.
        # Source: https://www.cloudflare.com/ips-v4 (update if Cloudflare adds ranges).
        patch:
          type: StrategicMerge
          value:
            spec:
              loadBalancerSourceRanges:
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: gcp-nlb-proxy
    namespace: shipzen-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shipzen-gateway
  namespace: shipzen-system
  # Annotations moved to EnvoyProxy above

spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
      # Fix #15: redirect all HTTP traffic to HTTPS.
      # Envoy Gateway implements this via an HTTPRoute filter attached to the
      # listener. The HTTPRoute below (shipzen-http-redirect) handles the
      # actual redirect; this listener just needs to accept routes from all
      # namespaces so the redirect route can bind to it.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: shipzen-tls-cert
      allowedRoutes:
        namespaces:
          from: All
---
# Fix #15: catch-all HTTPRoute on port 80 that issues a 301 redirect to HTTPS.
# Attach this to the http listener so all tenant traffic is upgraded.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shipzen-http-redirect
  namespace: shipzen-system
spec:
  parentRefs:
    - name: shipzen-gateway
      namespace: shipzen-system
      sectionName: http
  hostnames:
    - "*.jeneeldumasia.codes"
    - "shipzen.jeneeldumasia.codes"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
