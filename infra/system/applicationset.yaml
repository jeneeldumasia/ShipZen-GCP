apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-namespaces
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/jeneeldumasia/shipzen-tenants.git
        revision: HEAD
        directories:
          - path: namespaces/*
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      # Cascade: when a tenant folder is removed from shipzen-tenants, delete the
      # namespace and everything in it, not just the Application. Without this the
      # namespace was orphaned, and the controller (which waits for the namespace
      # to disappear) left the project stuck in Terminating.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/jeneeldumasia/shipzen-tenants.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
