apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - build-namespace.yaml
  - schema-configmap.yaml
  - schema-job.yaml
  - servicemonitors.yaml
  # alertmanager-config.yaml routes alerts to Slack/PagerDuty. Disabled: the Slack webhook in
  # Secret Manager (shipzen-alerts / slack-webhook-url) is a placeholder, so the operator rejected
  # the config and it showed as a permanent problem. Put a real https://hooks.slack.com/... URL
  # there (and a PagerDuty key, or drop that receiver), then uncomment.
  # - alertmanager-config.yaml
  - shipzen-tls-cert.yaml
  - shipzen-auth-secret.yaml
  - gateway.yaml
  - grafana-route.yaml
  - argocd-route.yaml
  - kyverno-exception.yaml
  - build-namespace-exception.yaml
  - grafana-dashboards.yaml
  - grafana-datasources.yaml
  - alert-relay.yaml
  - gateway-metrics.yaml
  - shipzen-alerts.yaml
  - github-app-secret.yaml
  - github-secret.yaml
  - rate-limit.yaml
  - tenant-deny-ingress.yaml
  - build-network-policy.yaml
  - applicationset.yaml
  - loki.yaml

# Code for the WhatsApp alert relay (alert-relay.yaml). The name gets a content
# hash, so changing relay.py rolls the Deployment.
configMapGenerator:
  - name: alert-relay-code
    namespace: observability
    files:
      - alert-relay/relay.py
