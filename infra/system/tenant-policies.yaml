# Kyverno rules for tenant namespaces (label shipzen.jeneeldumasia.codes/tenant=true).
# Defence in depth behind the controller's templates and the tenant AppProject.
#
# CEL-based ValidatingPolicy (policies.kyverno.io/v1): Kyverno 1.20 no longer
# runs the old kyverno.io ClusterPolicy type these used to be written in.
# `namespaceObject` is the namespace the request is in, so its labels (set by
# the controller) are read without an API call.

# A tenant ExternalSecret may read only its own project's secret, and only
# through the tenant store (whose Google identity can read shipzen-project-*
# and nothing else). Without this a tenant manifest could ask the store for
# another project's secret.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tenant-externalsecret-own-project
  annotations:
    policies.kyverno.io/title: Tenant ExternalSecrets read only their own project's secret
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        shipzen.jeneeldumasia.codes/tenant: "true"
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  variables:
    - name: projectId
      expression: >-
        namespaceObject.metadata.?labels[?'shipzen.jeneeldumasia.codes/project-id'].orValue('')
    - name: ownSecret
      expression: "'shipzen-project-' + variables.projectId"
  validations:
    - expression: >-
        object.spec.?secretStoreRef.?name.orValue('') == 'gcp-secret-manager-tenants' &&
        object.spec.?secretStoreRef.?kind.orValue('') == 'ClusterSecretStore'
      message: Tenant ExternalSecrets must use the gcp-secret-manager-tenants ClusterSecretStore.
    - expression: >-
        variables.projectId != '' &&
        object.spec.?dataFrom.orValue([]).all(d,
          has(d.extract) && !has(d.find) && d.extract.key == variables.ownSecret)
      messageExpression: >-
        'Tenant ExternalSecrets may only read ' + variables.ownSecret +
        ' (dataFrom.extract); find and other sources are not allowed.'
    - expression: "size(object.spec.?data.orValue([])) == 0"
      message: Tenant ExternalSecrets may not use spec.data; use dataFrom.extract of the project's secret.
---
# Every hostname shares one Gateway, which accepts routes from all namespaces.
# A tenant route may only claim hostnames of its own project, never the
# platform's or another project's:
#   <8-char release id>-<project slug>-shipzen.jeneeldumasia.codes
#   <its vanity name>-shipzen.jeneeldumasia.codes   (namespace label, set by the controller)
# Exactly 8 characters before the slug, and vanity names can't have that shape,
# so one project's pattern can't match another project's hostnames.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-hostnames
  annotations:
    policies.kyverno.io/title: Tenant routes only use their own project's hostnames
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        shipzen.jeneeldumasia.codes/tenant: "true"
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  variables:
    - name: slug
      expression: >-
        namespaceObject.metadata.?labels[?'shipzen.jeneeldumasia.codes/slug'].orValue('')
    - name: vanity
      expression: >-
        namespaceObject.metadata.?labels[?'shipzen.jeneeldumasia.codes/vanity'].orValue('')
  validations:
    - expression: >-
        variables.slug != '' &&
        object.spec.?hostnames.orValue([]).all(h,
          h.matches('^[a-z0-9]{8}-' + variables.slug + '-shipzen[.]jeneeldumasia[.]codes$') ||
          (variables.vanity != '' && h == variables.vanity + '-shipzen.jeneeldumasia.codes'))
      messageExpression: >-
        'Hostnames in this namespace must be <8-char release id>-' + variables.slug +
        '-shipzen.jeneeldumasia.codes or the project\'s vanity name.'
