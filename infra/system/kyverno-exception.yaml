apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: node-exporter-exception
  namespace: observability
spec:
  exceptions:
  - policyName: "disallow-host-namespaces"
    ruleNames:
    - "host-namespaces"
    - "autogen-host-namespaces"
  - policyName: "disallow-host-path"
    ruleNames:
    - "host-path"
    - "autogen-host-path"
  match:
    any:
    - resources:
        kinds:
        - Pod
        - apps/v1/DaemonSet
        namespaces:
        - observability
        names:
        - "*node-exporter*"
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: promtail-exception
  namespace: shipzen-system
spec:
  exceptions:
  - policyName: "disallow-host-path"
    ruleNames:
    - "host-path"
    - "autogen-host-path"
  match:
    any:
    - resources:
        kinds:
        - Pod
        - apps/v1/DaemonSet
        namespaces:
        - shipzen-system
        names:
        - "*promtail*"
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: promtail-host-path-exception
  namespace: shipzen-system
  annotations:
    shipzen.io/reason: "Promtail DaemonSet requires hostPath volume to read container logs from /var/log/pods."
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
  matchConditions:
    - name: match-promtail
      expression: "object.kind == 'DaemonSet' || object.kind == 'Pod'"
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter-vpol-exception
  namespace: observability
  annotations:
    shipzen.io/reason: "Node-exporter requires host namespaces and hostPath volumes."
spec:
  policyRefs:
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
  matchConditions:
    - name: match-node-exporter
      expression: "object.kind == 'DaemonSet' || object.kind == 'Pod'"
