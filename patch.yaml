
spec:
  template:
    spec:
      containers:
      - name: worker
        volumeMounts:
        - name: scripts
          mountPath: /app/main.py
          subPath: main.py
        - name: scripts
          mountPath: /app/builder.py
          subPath: builder.py
      volumes:
      - name: scripts
        configMap:
          name: worker-scripts

